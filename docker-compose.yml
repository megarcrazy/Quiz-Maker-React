version: "3.9"

services:
  backend:
    build: ./server
    container_name: quiz-backend
    ports:
      - "8000:8000"
    volumes:
      - ./server:/db/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./client
    container_name: quiz-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://127.0.0.1:8000
